version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: order_fulfillment_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword2026
      POSTGRES_DB: order_fulfillment_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_fulfillment_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: order_fulfillment_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order_fulfillment_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword2026@db:5432/order_fulfillment_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: supersecretjwtkeyfororderfulfillmentandinventorymanagementplatform2026
      ENVIRONMENT: production
      DEBUG: "False"
    volumes:
      - .:/app

volumes:
  postgres_data:
  redis_data:
